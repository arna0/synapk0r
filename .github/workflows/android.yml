name: Android app

# Builds the Flutter app (all four modules) and publishes the APK as the
# "android-latest" pre-release, so anyone can install it without Flutter.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'frontend/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', 'frontend/**', 'scripts/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Copy the web simulator into the app
        run: node scripts/sync-frontend.mjs
      - name: Generate missing platform files
        working-directory: mobile
        run: |
          flutter create . --platforms=android --project-name synapkor --org kz.synapkor
          # the generated sample test refers to a MyApp class this app does not have
          rm -f test/widget_test.dart
      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          code=0; flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || code=$?
          cat analyze.txt
          grep -E "error •" analyze.txt | while read -r l; do echo "::error::$l"; done
          exit $code
      - name: Build APK
        working-directory: mobile
        run: |
          code=0; flutter build apk --release --dart-define=API_BASE_URL=https://synapkor-api.epictitan2048.chatgpt.site > build.txt 2>&1 || code=$?
          tail -n 60 build.txt
          grep -E "(error|Error):" build.txt | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code
      - name: Publish as the android-latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk SynapKor.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest SynapKor.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --notes "Built automatically from commit $GITHUB_SHA. All four professions. Install the APK on an Android phone (allow installs from your browser). Hosted feedback is configured. Offline exercises and local reports remain available; submitted feedback retries when connected."
