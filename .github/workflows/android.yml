name: Android app

# Builds the Flutter app (all four modules) and publishes the APK as the
# "android-latest" pre-release, so anyone can install it without Flutter.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'frontend/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Copy the web simulator into the app
        run: node scripts/sync-frontend.mjs
      - name: Generate missing platform files
        working-directory: mobile
        run: flutter create . --platforms=android --project-name synapkor --org kz.synapkor
      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=
      - name: Publish as the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk SynapKor.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest SynapKor.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --notes "Built automatically from commit $GITHUB_SHA. All four professions. Install the APK on an Android phone (allow installs from your browser). AI debrief needs a running backend; without it the app shows the rule-based report."
