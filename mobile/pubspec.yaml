name: synapkor
description: "SynapKor - 3D profession simulator with skill assessment (VentureHack 2026, EduTech)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  webview_flutter: ^4.7.0
  flutter_spinkit: ^5.2.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Web client copied from ../frontend by `node ../scripts/sync-frontend.mjs`
  assets:
    - assets/sim/
    - assets/sim/css/
    - assets/sim/js/
